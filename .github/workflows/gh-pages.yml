name: Documentation Deploy
on:
  push:
    branches:
      - main
      - dev
jobs:
  docs:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: jiro4989/setup-nim-action@v2
        with:
          parent-nim-install-directory: ${{ runner.temp }}
          repo-token: ${{ github.token }}
      - run: git config --global --add safe.directory "$(pwd)"
      - run: nimble -y doc --index:on --out:docs --project src/playdate/api.nim
      - run: cp docs/api.html docs/index.html
      - name: Print environment variables
        run: |
          echo "ACT: ${{ env.ACT }}"
          echo "Ref: ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"
      - name: Deploy documents
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ !env.ACT && github.ref == 'refs/heads/main' && github.repository == 'samdze/playdate-nim' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
